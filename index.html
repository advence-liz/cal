<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国工作日历</title>
  <meta name="description" content="标注法定节假日、调休补班日、农历的静态工作日历，支持区间工作日数统计和 N 个工作日后计算。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="中国工作日历">
  <meta property="og:description" content="标注法定节假日、调休补班日、农历的静态工作日历，支持区间工作日数统计和 N 个工作日后计算。">
  <meta property="og:image" content="icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="中国工作日历">
  <meta name="twitter:description" content="标注法定节假日、调休补班日、农历的静态工作日历。">
  <meta name="twitter:image" content="icon-512.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://cdn.jsdelivr.net; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self';">
  <meta name="theme-color" content="#1e88e5">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>📅 中国工作日历</h1>
    <div class="topbar-right">
      <div class="next-holiday" id="nextHoliday">加载中…</div>
      <button id="themeToggle" type="button" class="theme-toggle" aria-label="切换深色模式">🌙</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="main">
    <section class="cal-panel">
      <div class="cal-nav">
        <button id="prevMonth" type="button" aria-label="上月">‹</button>
        <h2 id="monthTitle">—</h2>
        <button id="nextMonth" type="button" aria-label="下月">›</button>
        <button id="todayBtn" type="button" class="today-btn">回到今天</button>
      </div>

      <div class="activity-filters-wrap">
        <p class="activity-filters__hint">按活动看这个月宜办的日子：</p>
        <div class="activity-filters" id="activityFilters" role="group" aria-label="按活动筛选宜办的日子"></div>
        <p class="activity-filters__status" id="activityFiltersStatus" hidden>
          <span id="activityFiltersStatusText"></span>
          <button type="button" class="activity-find-btn" id="activityFindBtn">找最近一天 →</button>
        </p>
      </div>

      <div class="cal-grid" id="calGrid">
        <div class="cal-head">一</div>
        <div class="cal-head">二</div>
        <div class="cal-head">三</div>
        <div class="cal-head">四</div>
        <div class="cal-head">五</div>
        <div class="cal-head sat">六</div>
        <div class="cal-head sun">日</div>
      </div>

      <div class="day-popover" id="dayPopover" hidden role="tooltip"></div>

      <div class="legend">
        <span><i class="dot dot--holiday"></i>法定假</span>
        <span><i class="dot dot--makeup"></i>调休补班</span>
        <span><i class="dot dot--weekend"></i>周末</span>
        <span><i class="dot dot--today"></i>今天</span>
        <span><i class="dot dot--suits"></i>宜（筛选中）</span>
      </div>

      <div class="day-detail" id="dayDetail" hidden>
        <div class="day-detail__date" id="dayDetailDate"></div>
        <ul class="day-detail__lines" id="dayDetailLines"></ul>
        <div class="almanac-detail" id="almanacDetail">
          <div class="almanac-row almanac-row--yi">
            <span class="almanac-label almanac-label--yi">宜</span>
            <div class="almanac-tags" id="almanacYi"></div>
          </div>
          <div class="almanac-row almanac-row--ji">
            <span class="almanac-label almanac-label--ji">忌</span>
            <div class="almanac-tags" id="almanacJi"></div>
          </div>
          <div class="day-detail__facts" id="dayDetailFacts"></div>
        </div>
      </div>
    </section>

    <aside class="tools">
      <article class="tool-card">
        <h3>区间工作日数</h3>
        <form id="countForm">
          <label>起：<input type="date" name="start" required></label>
          <label>止：<input type="date" name="end" required></label>
          <button type="submit">计算</button>
        </form>
        <output class="result" id="countResult"></output>
      </article>

      <article class="tool-card">
        <h3>N 个工作日后</h3>
        <form id="addForm">
          <label>起：<input type="date" name="start" required></label>
          <label>N：<input type="number" name="n" required step="1" value="5"></label>
          <button type="submit">计算</button>
        </form>
        <output class="result" id="addResult"></output>
        <small class="hint">N 可为负（向前数）。N=0 返回起始日本身。</small>
      </article>
    </aside>
  </main>

  <footer class="foot">
    数据源：
    <a href="https://github.com/NateScarlet/holiday-cn" target="_blank" rel="noopener">NateScarlet/holiday-cn</a>
    （国务院办公厅口径，含调休）
  </footer>

  <script src="vendor/lunar.js"></script>
  <script type="module" src="app.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
