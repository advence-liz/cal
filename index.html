<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>摸鱼日历</title>
  <meta name="description" content="法定节假日、调休、农历宜忌 + 拼假攻略。静态 PWA，零外部依赖。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="摸鱼日历">
  <meta property="og:description" content="法定节假日、调休、农历宜忌 + 拼假攻略。静态 PWA，零外部依赖。">
  <meta property="og:image" content="icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="摸鱼日历">
  <meta name="twitter:description" content="法定节假日、调休、农历宜忌 + 拼假攻略，帮你摸得明明白白。">
  <meta name="twitter:image" content="icon-512.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://cdn.jsdelivr.net; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self';">
  <meta name="theme-color" content="#fafafa">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <div class="topbar-brand-row">
        <h1><img src="icon.svg" alt="" class="app-logo" width="24" height="24"><span data-i18n="appTitle">摸鱼日历</span></h1>
        <details class="region-picker" id="holidayRegion">
          <summary id="regionTrigger" aria-label="假期地区：中国大陆">
            <svg class="region-globe" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2">
              <circle cx="8" cy="8" r="6"/><ellipse cx="8" cy="8" rx="2.6" ry="6"/><path d="M2 8h12"/>
            </svg>
            <span id="regionLabel">中国大陆</span>
            <svg class="region-chevron" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 4.5 3 3 3-3"/></svg>
          </summary>
          <div class="region-menu" role="group" aria-labelledby="regionMenuTitle" aria-describedby="holidayScope">
            <p id="regionMenuTitle" data-i18n="regionTitle">假期地区</p>
            <button type="button" data-region="CN" data-i18n="regionCN" aria-pressed="true">中国大陆</button>
            <button type="button" data-region="US" data-i18n="regionUS" aria-pressed="false">美国联邦</button>
            <button type="button" data-region="SG" data-i18n="regionSG" aria-pressed="false">新加坡</button>
            <button type="button" data-region="JP" data-i18n="regionJP" aria-pressed="false">日本</button>
            <button type="button" data-region="GB" data-i18n="regionGB" aria-pressed="false">英格兰和威尔士</button>
            <button type="button" data-region="FR" data-i18n="regionFR" aria-pressed="false">法国本土</button>
            <button type="button" data-region="ZA" data-i18n="regionZA" aria-pressed="false">南非</button>
            <button type="button" data-region="IN" data-i18n="regionIN" aria-pressed="false">印度（德里中央机关）</button>
            <button type="button" data-region="BR" data-i18n="regionBR" aria-pressed="false">巴西</button>
            <button type="button" data-region="AU" data-i18n="regionAU" aria-pressed="false">澳大利亚（新南威尔士州）</button>
            <button type="button" data-region="SA" data-i18n="regionSA" aria-pressed="false">沙特阿拉伯（金融业）</button>
            <p class="region-scope" id="holidayScope">国务院办公厅口径，含调休补班</p>
          </div>
        </details>
      </div>
      <details class="region-picker clock-picker" id="clockPicker" hidden>
        <summary class="region-clock" id="clockTrigger" aria-label="时钟时区">
          <span id="regionClockCity"></span> <time id="regionClockTime"></time>
          <span class="region-clock__offset" id="regionClockOffset"></span>
          <svg class="region-chevron" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 4.5 3 3 3-3"/></svg>
        </summary>
        <div class="region-menu clock-menu" role="group" aria-labelledby="clockMenuTitle">
          <p id="clockMenuTitle" data-i18n="clockTitle">时钟时区</p>
          <button type="button" data-zone="auto" data-i18n="clockAuto" aria-pressed="true">跟随假期地区</button>
          <div id="clockOptions"></div>
        </div>
      </details>
    </div>
    <div class="topbar-right">
      <div class="next-holiday" id="nextHoliday">加载中…</div>
      <div class="workday-remaining" id="workdayRemaining" hidden></div>
      <a href="guide.html" class="language-toggle guide-link" data-i18n="guideLink">使用指南</a>
      <button id="languageToggle" type="button" class="language-toggle" lang="en">English</button>
      <button data-i18n-label="theme" id="themeToggle" type="button" class="theme-toggle" aria-label="切换深色模式">🌙</button>
    </div>
  </header>

  <div class="status-bar" id="statusBar" role="status" aria-live="polite" hidden></div>

  <main class="main">
    <section class="cal-panel">
      <div class="cal-nav">
        <button id="prevMonth" type="button" aria-label="上月" data-i18n-label="prev">‹</button>
        <h2 id="monthTitle">—</h2>
        <button id="nextMonth" type="button" aria-label="下月" data-i18n-label="next">›</button>
        <button id="todayBtn" data-i18n="today" type="button" class="today-btn">回到今天</button>
      </div>

      <div class="activity-filters-wrap" id="activityPanel">
        <p class="activity-filters__hint" id="activityPrompt">按活动看这个月宜办的日子：</p>
        <div class="activity-filters" id="activityFilters" data-i18n-label="activityLabel" role="group" aria-label="按活动筛选宜办的日子"></div>
        <p class="activity-filters__status" id="activityFiltersStatus" role="status" aria-live="polite" hidden>
          <span id="activityFiltersStatusText"></span>
          <button type="button" class="activity-find-btn" id="activityFindBtn" data-i18n="findActivity">找最近一天 →</button>
        </p>
      </div>

      <div class="cal-grid" id="calGrid">
        <div class="cal-head" data-weekday="1" data-i18n="weekday1">一</div>
        <div class="cal-head" data-weekday="2" data-i18n="weekday2">二</div>
        <div class="cal-head" data-weekday="3" data-i18n="weekday3">三</div>
        <div class="cal-head" data-weekday="4" data-i18n="weekday4">四</div>
        <div class="cal-head" data-weekday="5" data-i18n="weekday5">五</div>
        <div class="cal-head cal-head--weekend" data-weekday="6" data-i18n="weekday6">六</div>
        <div class="cal-head cal-head--weekend" data-weekday="0" data-i18n="weekday0">日</div>
      </div>

      <div class="day-popover" id="dayPopover" hidden role="tooltip"></div>

      <div class="legend">
        <span><i class="dot dot--holiday"></i><span data-i18n="holiday">法定假</span></span>
        <span id="makeupLegend"><i class="dot dot--makeup"></i><span data-i18n="makeup">调休补班</span></span>
        <span><i class="dot dot--weekend"></i><span data-i18n="weekend">周末</span></span>
        <span><i class="dot dot--today"></i><span data-i18n="todayShort">今天</span></span>
        <span id="suitsLegend"><i class="dot dot--suits"></i><span data-i18n="suitable">宜（筛选中）</span></span>
      </div>

      <div id="almanacShelf" class="almanac-shelf" hidden>
        <button type="button" id="almanacToggle" class="almanac-toggle" aria-controls="activityPanel" aria-expanded="false">显示农历宜忌</button>
      </div>

      <div class="day-detail" id="dayDetail" hidden>
        <div class="day-detail__date" id="dayDetailDate"></div>
        <ul class="day-detail__lines" id="dayDetailLines"></ul>
        <div class="almanac-detail" id="almanacDetail">
          <div class="almanac-row almanac-row--yi">
            <span class="almanac-label almanac-label--yi" data-i18n="yi">宜</span>
            <div class="almanac-tags" id="almanacYi"></div>
          </div>
          <div class="almanac-row almanac-row--ji">
            <span class="almanac-label almanac-label--ji" data-i18n="ji">忌</span>
            <div class="almanac-tags" id="almanacJi"></div>
          </div>
          <p id="almanacTranslationNote" class="hint" data-i18n="legacyNote" hidden></p>
          <div class="day-detail__facts" id="dayDetailFacts"></div>
        </div>
      </div>
    </section>

    <aside class="leave-side" aria-label="拼假攻略" data-i18n-label="leaveLabel">
      <article class="tool-card tool-card--featured" id="leavePlanCard">
        <h3 data-i18n="leaveTitle">🎉 拼假攻略</h3>
        <div class="leave-plan-list" id="leavePlanResult"></div>
        <small class="hint" id="leaveCoverage" data-i18n="leaveCoverage" hidden>拼假攻略仅覆盖已收录假期数据的连续日期。</small>
      </article>
    </aside>

    <aside class="tools">
      <article class="tool-card">
        <h3 data-i18n="countTitle">区间工作日数</h3>
        <form id="countForm">
          <label><span data-i18n="start">起：</span><input type="date" name="start" required></label>
          <label><span data-i18n="end">止：</span><input type="date" name="end" required></label>
          <button type="submit" data-i18n="calculate">计算</button>
        </form>
        <output class="result" id="countResult"></output>
      </article>

      <article class="tool-card">
        <h3 data-i18n="addTitle">N 个工作日后</h3>
        <form id="addForm">
          <label><span data-i18n="start">起：</span><input type="date" name="start" required></label>
          <label>N：<input type="number" name="n" required step="1" value="5"></label>
          <button type="submit" data-i18n="calculate">计算</button>
        </form>
        <output class="result" id="addResult"></output>
        <small class="hint" data-i18n="addNote">N 可为负（向前数）。N=0 返回起始日本身。</small>
      </article>
    </aside>
  </main>

  <div class="mobile-nav-bar" id="mobileNavBar">
    <button id="prevMonthMobile" type="button" aria-label="上月" data-i18n-label="prev">‹</button>
    <span id="monthTitleMobile">—</span>
    <button id="nextMonthMobile" type="button" aria-label="下月" data-i18n-label="next">›</button>
    <button id="todayBtnMobile" data-i18n="todayShort" type="button">今天</button>
  </div>

  <footer class="foot">
    <span data-i18n="source">数据源：</span>
    <a id="holidaySource" href="https://github.com/NateScarlet/holiday-cn" target="_blank" rel="noopener">NateScarlet/holiday-cn</a>
  </footer>

  <script src="vendor/lunar.js"></script>
  <script type="module" src="app.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
