<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#1e88e5"/>
  <!-- 3x3 day-cell grid, echoing the app's own calendar grid + color coding
       (red = 法定假, green = 宜) instead of copying the generic
       torn-page/ring-binder calendar icon convention. -->
  <rect x="24" y="24" width="20" height="20" rx="5" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="54" y="24" width="20" height="20" rx="5" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="84" y="24" width="20" height="20" rx="5" fill="#e53935"/>
  <rect x="24" y="54" width="20" height="20" rx="5" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="54" y="54" width="20" height="20" rx="5" fill="#2e7d32"/>
  <rect x="84" y="54" width="20" height="20" rx="5" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="24" y="84" width="20" height="20" rx="5" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="54" y="84" width="20" height="20" rx="5" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="84" y="84" width="20" height="20" rx="5" fill="#ffffff" fill-opacity="0.92"/>
</svg>
