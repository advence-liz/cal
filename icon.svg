<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#1e88e5"/>
  <!-- Header + page-body split is the one genuinely universal "calendar" cue
       (predates any specific app), so it's kept — but no red band, no rings,
       no giant date number, so it doesn't read as an Apple Calendar clone.
       The body carries the app's own color coding instead (red = 法定假,
       green = 宜) via a small day-cell grid rather than a single big number. -->
  <rect x="10" y="42" width="108" height="76" rx="14" fill="#ffffff"/>
  <rect x="20" y="52" width="16" height="16" rx="5" fill="#dbe9f7"/>
  <rect x="42" y="52" width="16" height="16" rx="5" fill="#dbe9f7"/>
  <rect x="64" y="52" width="16" height="16" rx="5" fill="#dbe9f7"/>
  <rect x="86" y="52" width="16" height="16" rx="5" fill="#e53935"/>
  <rect x="20" y="74" width="16" height="16" rx="5" fill="#dbe9f7"/>
  <rect x="42" y="74" width="16" height="16" rx="5" fill="#2e7d32"/>
  <rect x="64" y="74" width="16" height="16" rx="5" fill="#dbe9f7"/>
  <rect x="86" y="74" width="16" height="16" rx="5" fill="#dbe9f7"/>
</svg>
