name: Deploy calendar MCP to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'data/holidays-*.json'
      - 'holidays.js'
      - 'mcp/**'
      - '.github/workflows/deploy-mcp-worker.yml'
  # The CN vendor merges through GITHUB_TOKEN; that push does not start Actions.
  workflow_run:
    workflows: ['Vendor holiday-cn data']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: calendar-mcp-worker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      WORKER_MCP_URL: https://calendar-mcp-benchmark.calendar-workday-lab.workers.dev/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          # Never execute or publish the upstream run's head, PR files, or artifacts.
          # Resolve latest main when this serialized job starts, not when it was queued.
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --prefix mcp
      - run: npm test --prefix mcp

      - name: Deploy the verified revision unless it is already active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repository Actions secrets.'
            exit 1
          fi
          revision=$(git log -1 --format=%H -- 'data/holidays-*.json' holidays.js mcp .github/workflows/deploy-mcp-worker.yml)
          node mcp/publish-worker.mjs "$revision"

      - name: Verify the live Worker against the published snapshots
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 8 --retry-max-time 40 "${WORKER_MCP_URL%/mcp}/health"
          node --test mcp/worker.test.mjs
