name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  holiday-source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test official-source parsers
        run: python3 -B -m unittest discover -s scripts -p 'test_vendor_holidays_intl.py'

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test dependencies
        run: |
          npm ci
          npm exec -- puppeteer browsers install chrome

      - name: Serve the site
        run: python3 -m http.server 8080 &

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/tests.html > /dev/null && exit 0
            sleep 0.5
          done
          echo "server did not come up in time" >&2
          exit 1

      - name: Run browser tests
        run: npm test
