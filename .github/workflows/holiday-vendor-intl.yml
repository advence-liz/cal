name: Check international holiday data

on:
  push:
    branches: [verify/holiday-actions-6e30164]

permissions:
  contents: read

# Separate this one-off verification from the production schedule.
concurrency:
  group: holiday-vendor-intl-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        region: [us, sg, jp, gb, fr, za, au, sa]
    env:
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test official-source parsers
        run: python3 -B -m unittest discover -s scripts -p 'test_vendor_holidays_intl.py'

      - name: Check official data
        id: vendor
        run: |
          set -o pipefail
          python3 -I scripts/vendor_holidays_intl.py "$REGION" --apply | tee "$RUNNER_TEMP/holiday-vendor.log"
          grep -E '^changed=(true|false)$' "$RUNNER_TEMP/holiday-vendor.log" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.vendor.outputs.changed == 'true'
        with:
          node-version: 24

      - name: Test the proposed data in the browser
        if: steps.vendor.outputs.changed == 'true'
        run: |
          npm ci
          npm exec -- puppeteer browsers install chrome
          python3 -I -m http.server 8080 --bind 127.0.0.1 &
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/tests.html >/dev/null; then
              npm test
              exit $?
            fi
            sleep 0.5
          done
          echo "Test server failed to start" >&2
          exit 1

      - name: Report the check result
        if: always()
        env:
          CHANGED: ${{ steps.vendor.outputs.changed }}
          CHECK_OUTCOME: ${{ steps.vendor.outcome }}
        run: |
          printf '### %s\n\nOfficial-source check: %s · Snapshot changed: %s\n' \
            "$REGION" "$CHECK_OUTCOME" "${CHANGED:-unverified}" >> "$GITHUB_STEP_SUMMARY"
          printf '\nNo changes were pushed and no pull request was opened.\n' >> "$GITHUB_STEP_SUMMARY"
